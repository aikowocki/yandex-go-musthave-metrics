version: '3'

dotenv: ['.env']

tasks:
  build:
    desc: Build server and agent
    cmds:
      - task: build-server
      - task: build-agent

  build-server:
    desc: Build server with build info
    vars:
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "N/A"
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "N/A"
    cmds:
      - go build -ldflags "-X main.buildVersion={{.VERSION}} -X main.buildDate={{.DATE}} -X main.buildCommit={{.COMMIT}}" -o cmd/server/server ./cmd/server

  build-agent:
    desc: Build agent with build info
    vars:
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "N/A"
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "N/A"
    cmds:
      - go build -ldflags "-X main.buildVersion={{.VERSION}} -X main.buildDate={{.DATE}} -X main.buildCommit={{.COMMIT}}" -o cmd/agent/agent ./cmd/agent

  test:
    desc: Run all tests
    cmds:
      - go test -race ./...

  test-fresh:
    desc: Run all tests without cache
    cmds:
      - go clean -testcache
      - go test -race ./...

  test-integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - go clean -testcache
      - go test -race ./internal/storage/metric/... -v -integration

  test-cover:
    desc: Run tests with coverage report
    cmds:
      - go test -race ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  golines:
    desc: Сократить длинные строки (макс 120 символов)
    cmds:
      - golines -w -m 120 --shorten-comments .

  run-server:
    desc: Run server
    cmds:
      - go run ./cmd/server

  run-agent:
    desc: Run agent
    cmds:
      - go run ./cmd/agent

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f cmd/server/server
      - rm -f cmd/agent/agent

  keygen:
    desc: "Сгенерировать пару RSA-ключей для шифрования"
    vars:
      KEYS_DIR: '{{.KEYS_DIR | default "keys"}}'
    cmds:
      - go run ./cmd/keygen -public {{.KEYS_DIR}}/public.pem -private {{.KEYS_DIR}}/private.pem
    status:
      - test -f {{.KEYS_DIR}}/public.pem
      - test -f {{.KEYS_DIR}}/private.pem

  autotest-1:
    desc: Run iteration 1 autotest
    deps: [build-server]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration1$ -binary-path=cmd/server/server

  autotest-2:
    desc: Run iteration 2 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration2[AB]$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=.

  autotest-3:
    desc: Run iteration 3 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration3[AB]$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=.

  autotest-4:
    desc: Run iteration 4 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration4$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080

  autotest-5:
    desc: Run iteration 5 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration5$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080

  autotest-6:
    desc: Run iteration 6 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration6$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080

  autotest-7:
    desc: Run iteration 7 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration7$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080

  autotest-8:
    desc: Run iteration 8 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration8$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080

  autotest-9:
    desc: Run iteration 9 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration9$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -file-storage-path=backup/metrics.json

  autotest-10:
    desc: Run iteration 10 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration10[AB]*$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -database-dsn='{{.DATABASE_DSN}}'

  autotest-11:
    desc: Run iteration 11 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration11$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -database-dsn='{{.DATABASE_DSN}}'

  autotest-12:
    desc: Run iteration 12 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration12$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -database-dsn='{{.DATABASE_DSN}}'

  autotest-13:
    desc: Run iteration 13 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration13$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -database-dsn='{{.DATABASE_DSN}}'

  autotest-14:
    desc: Run iteration 14 autotest
    deps: [build-server, build-agent]
    cmds:
      - chmod +x metricstest_v2-darwin-arm64
      - ./metricstest_v2-darwin-arm64 -test.v -test.run=^TestIteration14$ -binary-path=cmd/server/server -agent-binary-path=cmd/agent/agent -source-path=. -server-port=8080 -database-dsn='{{.DATABASE_DSN}}' -key='{{.KEY}}'


  doc:
    desc: "Запустить локальный сервер документации"
    cmds:
      - pkgsite -http=:8088

  db-up:
    desc: "Запустить PostgreSQL контейнер"
    cmds:
      - docker compose -f deployments/docker-compose.yml up -d postgres

  db-down:
    desc: "Остановить PostgreSQL контейнер"
    cmds:
      - docker compose -f deployments/docker-compose.yml stop postgres

  up:
    desc: "Поднять весь стек (postgres + server + agent)"
    vars:
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "N/A"
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "N/A"
    cmds:
      - BUILD_VERSION={{.VERSION}} BUILD_DATE={{.DATE}} BUILD_COMMIT={{.COMMIT}} docker compose -f deployments/docker-compose.yml up -d --build

  down:
    desc: "Остановить весь стек"
    cmds:
      - docker compose -f deployments/docker-compose.yml down

  logs:
    desc: "Логи всего стека"
    cmds:
      - docker compose -f deployments/docker-compose.yml logs -f

  rebuild:
    desc: "Пересобрать образы server и agent без кеша"
    cmds:
      - docker compose -f deployments/docker-compose.yml build --no-cache server agent

  db-logs:
    desc: "Показать логи PostgreSQL"
    cmds:
      - docker compose -f deployments/docker-compose.yml logs -f postgres

  db-psql:
    desc: "Подключиться к PostgreSQL через psql"
    cmds:
      - source deployments/.env && docker compose -f deployments/docker-compose.yml exec -e PGUSER=$POSTGRES_USER -e PGDATABASE=$POSTGRES_DB postgres psql

  db-status:
    desc: "Проверить статус PostgreSQL контейнера"
    cmds:
      - docker compose -f deployments/docker-compose.yml ps postgres